name: publish-npm

on:
  workflow_dispatch:

jobs:
  publish:
    runs-on: ubuntu-latest
    permissions:
      id-token: write
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          registry-url: https://registry.npmjs.org
      - name: Ensure npm supports trusted publishing (>= 11.5.1)
        run: |
          npm install -g npm@latest
          npm --version
      - run: node --check install.js
      - name: Publish (npm trusted publishing / OIDC)
        run: |
          version=$(node -p "require('./package.json').version")
          if npm view "@khalidsaidi/wontdo@$version" version >/dev/null 2>&1; then
            echo "$version is already on npm"
          else
            npm publish --access public
          fi
